name: Weekly Indian medicine catalog review

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-indian-medicine-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install catalog tooling
        run: npm ci

      - name: Synchronize permitted official sources
        run: npm run catalog:sync -- --force

      - name: Generate, validate and report
        run: npm run catalog:all

      - name: Push the catalog review branch
        id: review
        env:
          REVIEW_BRANCH: catalog/weekly-sync
        run: |
          git config user.name "medicure-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$REVIEW_BRANCH"
          git add assets/data scripts/catalog/seed-products.json medicines sitemap.xml
          if git diff --cached --quiet; then
            if git show-ref --verify --quiet "refs/remotes/origin/$REVIEW_BRANCH" &&
               ! git diff --quiet origin/main "origin/$REVIEW_BRANCH" -- assets/data scripts/catalog/seed-products.json medicines sitemap.xml; then
              review_sha="$(git rev-parse "origin/$REVIEW_BRANCH")"
              git show "$review_sha:assets/data/catalog-update-report.md" > "$RUNNER_TEMP/catalog-update-report.md"
              echo "pending=true" >> "$GITHUB_OUTPUT"
              echo "sha=$review_sha" >> "$GITHUB_OUTPUT"
            else
              echo "pending=false" >> "$GITHUB_OUTPUT"
              echo "### Catalog review: no pending changes" >> "$GITHUB_STEP_SUMMARY"
              echo "No newly generated or previously pushed catalog changes require review." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          git commit -m "chore: refresh Indian medicine catalog"
          git push --force-with-lease origin "$REVIEW_BRANCH"
          cp assets/data/catalog-update-report.md "$RUNNER_TEMP/catalog-update-report.md"
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Hand off the catalog for human review
        if: steps.review.outputs.pending == 'true'
        uses: actions/github-script@v9
        env:
          REVIEW_SHA: ${{ steps.review.outputs.sha }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { readFile } = await import('node:fs/promises');
            const { handoffCatalogReview } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/catalog/review-handoff.mjs`).href);
            await handoffCatalogReview({
              github, core, ...context.repo,
              branch: 'catalog/weekly-sync', base: 'main',
              sha: process.env.REVIEW_SHA,
              body: await readFile(`${process.env.RUNNER_TEMP}/catalog-update-report.md`, 'utf8'),
              serverUrl: process.env.GITHUB_SERVER_URL,
            });

      - name: Preserve generated review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-review-reports
          path: |
            assets/data/catalog-sync-report.json
            assets/data/catalog-update-report.md
          if-no-files-found: warn
