name: Weekly Indian medicine catalog review

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-indian-medicine-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install catalog tooling
        run: npm ci

      - name: Synchronize permitted official sources
        run: npm run catalog:sync -- --force

      - name: Generate, validate and report
        run: npm run catalog:all

      - name: Create or refresh the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: catalog/weekly-sync
        run: |
          git config user.name "medicure-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$REVIEW_BRANCH"
          git add assets/data scripts/catalog/seed-products.json medicines sitemap.xml
          if git diff --cached --quiet; then
            echo "No catalog changes require review."
            exit 0
          fi
          git commit -m "chore: refresh Indian medicine catalog"
          git push --force-with-lease origin "$REVIEW_BRANCH"
          existing_pr="$(gh pr list --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Review weekly Indian medicine catalog update" --body-file assets/data/catalog-update-report.md
          else
            gh pr create --base main --head "$REVIEW_BRANCH" --title "Review weekly Indian medicine catalog update" --body-file assets/data/catalog-update-report.md
          fi
